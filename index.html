<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Memoria</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <h1>Juego de Memoria</h1>
        
        <div class="fila">
            <input id="nombre" placeholder="Tu nombre...">
            <select id="dificultad">
                <option value="4">Fácil (4 parejas)</option>
                <option value="8" selected>Normal (8 parejas)</option>
                <option value="12">Difícil (12 parejas)</option>
            </select>
            <button id="reiniciar">Reiniciar Juego</button>
        </div>

        <div id="tablero"></div>
        
        <p id="info">Movimientos: <span id="contador">0</span></p>
        <p id="mensaje"></p>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
