<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juego de Memoria — versión auditada y corregida</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:540px;margin:40px auto;padding:0 16px;color:#222}
  h1{font-size:1.4rem}
  .fila{display:flex;gap:8px;margin-bottom:16px}
  input{flex:1;padding:8px 10px;font-size:1rem;border:1px solid #bbb;border-radius:6px}
  button{padding:8px 12px;font-size:1rem;cursor:pointer;border:1px solid #888;border-radius:6px;background:#f3f3f3}
  #tablero{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px}
  .carta{aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    font-size:1.8rem;background:#2b3a42;color:#fff;border-radius:10px;cursor:pointer;user-select:none}
  .carta.volteada{background:#e8eef0;color:#222}
  .carta.encontrada{background:#cdebd7;color:#222;cursor:default}
  #movimientos{color:#666;font-size:.9rem;margin-top:14px}
  #mensaje{font-size:1.1rem;font-weight:600;margin-top:8px}
</style>
</head>
<body>
<h1>Juego de Memoria</h1>

<div class="fila">
  <input id="nombre" placeholder="Tu nombre...">
  <button id="iniciar">Iniciar / Reiniciar</button>
</div>

<div id="tablero"></div>
<p id="movimientos"></p>
<p id="mensaje"></p>

<script>
  const EMOJIS = ['🍎', '🚀', '🐱', '🌵', '🎲', '🎧', '⚽', '🍕'];
  let cartas = [];      
  let volteadas = [];   
  let movimientos = 0;
  let nombre = '';
  let timerId = null; // FIX (Rendimiento): Declaramos el timer globalmente para controlarlo.

  const tablero = document.getElementById('tablero');

  function sanitizar(texto) {
    const div = document.createElement('div');
    div.textContent = texto;
    return div.innerHTML;
  }

  document.getElementById('iniciar').addEventListener('click', function () {
    nombre = sanitizar(document.getElementById('nombre').value);
    
    // FIX (Rendimiento/Arquitectura): Si el usuario reinicia mientras las cartas se muestran, matamos el proceso.
    if (timerId) { clearTimeout(timerId); timerId = null; }
    
    cartas = [];
    EMOJIS.forEach(function (e) {
      cartas.push({ emoji: e, encontrada: false });
      cartas.push({ emoji: e, encontrada: false });
    });
    cartas.sort(function () { return Math.random() - 0.5; });
    volteadas = [];
    movimientos = 0;
    document.getElementById('mensaje').textContent = '';
    render();
  });

  function render() {
    tablero.innerHTML = '';
    for (let i = 0; i < cartas.length; i++) {
      const div = document.createElement('div');
      div.className = 'carta';
      div.dataset.indice = i;
      div.textContent = cartas[i].encontrada ? cartas[i].emoji : '?';
      div.addEventListener('click', function () {
        voltearCarta(div);
      });
      tablero.appendChild(div);
    }
    document.getElementById('movimientos').textContent = 'Movimientos: ' + movimientos;
  }

  function voltearCarta(div) {
    const i = Number(div.dataset.indice);

    // BUG (Funcional): Sin bloqueo, el usuario podía saturar el juego con clics.
    // FIX (Lógica): Guardas para evitar clics múltiples o en cartas resueltas.
    // BUG (Funcional/Condición de carrera): Los clics durante el setTimeout no se bloqueaban.
    // FIX: La validación volteadas.length >= 2 bloquea el tablero durante la espera del timer.
    if (cartas[i].encontrada || volteadas.includes(i) || volteadas.length >= 2) return;

    div.textContent = cartas[i].emoji;
    div.classList.add('volteada');
    volteadas.push(i);

    if (volteadas.length === 2) {
      movimientos++;
      document.getElementById('movimientos').textContent = 'Movimientos: ' + movimientos;
      const [a, b] = volteadas;

      // BUG (Arquitectura): Lectura del DOM para lógica (divs[a].textContent).
      // FIX (Arquitectura): Comparación basada en la Fuente Única de Verdad (cartas[i].emoji).
      if (cartas[a].emoji === cartas[b].emoji) {
        cartas[a].encontrada = true;
        cartas[b].encontrada = true;
        tablero.children[a].classList.add('encontrada');
        tablero.children[b].classList.add('encontrada');
        volteadas = [];
        revisarVictoria();
      } else {
        // FIX (Rendimiento/Arquitectura): Guardamos el ID del timer para poder cancelarlo si se reinicia.
        timerId = setTimeout(() => {
          tablero.children[a].textContent = '?';
          tablero.children[b].textContent = '?';
          tablero.children[a].classList.remove('volteada');
          tablero.children[b].classList.remove('volteada');
          volteadas = [];
          timerId = null; 
        }, 800);
      }
    }
  }

  function revisarVictoria() {
    if (cartas.every(c => c.encontrada)) {
      // BUG (Seguridad): innerHTML con datos de usuario es vector de ataque XSS.
      // FIX (Seguridad): Usamos textContent para forzar texto plano.
      document.getElementById('mensaje').textContent = '¡Ganaste, ' + nombre + '! 🎉';
    }
  }
</script>
</body>
</html>
